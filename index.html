<html lang="id">

    <style>
        .pvtUi { width: 100%; font-family: inherit; }

        .pvtAttr { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        table.pvtTable { font-size: 13px; border-collapse: collapse; width: 100%; margin-top: 10px; }
        table.pvtTable thead tr th, table.pvtTable tbody tr th { background-color: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; }
        table.pvtTable tbody tr td { border: 1px solid #e2e8f0; padding: 6px 10px; }
    </style>
</head>
